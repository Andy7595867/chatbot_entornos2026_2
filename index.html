<!DOCTYPE html>
<html lang="es">
<head>
    <link rel="stylesheet" href="styles.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
 <h1 class="clase-titulo">
    mundo danna 
 </h1>
 <p  class="clase-parrafo" id ="parrafo-llm">
 ¡Hola!¿como estas? En que te puedo ayudar el dia de hoy  
 </p>
  
 <button  id ="boton-accionador">
    ACEPTAR
 </button>
 <input type= "Ingrese Texto" id="input-prompt">
 <script>
document.getElementById("boton-accionador").onclick =async() =>{

const prompt = document.getElementById("input-prompt").value;
const res = await fetch("http://127.0.0.1:8000/chat/"+prompt)
console.log(prompt)
const datos =await res.json()
console.log(datos.Respuesta )

document.getElementById("parrafo-llm").textContent =datos.Respuesta;
}
 </script>
</body>
</html>
